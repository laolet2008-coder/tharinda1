<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบเบิก-คืนโทรศัพท์นักเรียน 🐰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* นิยามสีโทนชมพูหวานๆ */
    :root {
      --sweet-pink: #FF9AA2; /* ชมพูอ่อนหลัก */
      --soft-purple: #C7CEEA; /* ม่วงอ่อนรอง */
      --main-bg-gradient: linear-gradient(135deg, #FFF0F5 0%, #FFD1DC 100%); /* พื้นหลังไล่สี */
      --card-bg: rgba(255, 255, 255, 0.95); /* พื้นหลังการ์ดขาวขุ่นเล็กน้อย */
      --text-color: #5D4037; /* สีตัวอักษรน้ำตาลเข้ม ดูนุ่มนวล */
      --card-border-color: #FFC0CB; /* สีขอบการ์ดชมพู */
      --input-border-color: #F8BBD0; /* สีขอบกล่องข้อความชมพูอ่อน */
      --input-focus-shadow-color: rgba(255, 154, 162, 0.4); /* สีเงาเมื่อคลิกกล่องข้อความ */
      --submit-btn-color: #FF8A80; /* สีปุ่มบันทึกชมพูเข้ม */
      --submit-btn-hover-color: #FF5252; /* สีปุ่มบันทึกเมื่อชี้เมาส์ */
      --submit-btn-text-color: #fff; /* สีตัวอักษรปุ่ม */
    }

    body { 
      background-image: var(--main-bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      padding-top: 50px; 
      font-family: 'Sarabun', sans-serif; 
    }

    /* กล่องการ์ดหลัก */
    .card { 
      background: var(--card-bg);
      border: 3px solid var(--card-border-color); /* เพิ่มขอบ */
      box-shadow: 0 0 30px rgba(255, 192, 203, 0.3); /* ใส่เงาสีชมพูอ่อนๆ */
      border-radius: 25px; /* มุมโค้งมนมากขึ้น */
      position: relative;
      overflow: hidden;
    }

    /* ภาพการ์ดตัวการ์ตูน (ใช้ Emoji และการจัดวาง) */
    .cartoon-mascot {
      position: absolute;
      font-size: 8rem;
      color: var(--sweet-pink);
      top: -30px;
      right: -40px;
      opacity: 0.2;
    }

    .header-box {
      border-bottom: 2px solid rgba(255, 192, 203, 0.2); /* ขอบล่างอ่อนๆ */
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .header-title {
      color: #D81B60; /* สีหัวข้อหลักชมพูเข้ม */
      text-shadow: 1px 1px 2px rgba(216, 27, 96, 0.1);
      font-weight: 700;
    }

    .form-label {
      font-weight: 600;
      color: #8D6E63; /* สีตัวอักษร Label น้ำตาลอ่อนนุ่ม */
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    /* กล่อง Input และ Dropdown */
    .form-control, .form-select {
      background-color: #fff !important; /* พื้นหลังขาวล้วน */
      border-radius: 12px; /* มุมโค้งมน */
      padding: 12px 15px;
      border: 2px solid var(--input-border-color);
      color: var(--text-color) !important;
      transition: all 0.3s ease;
    }

    .form-control::placeholder {
      color: #A1887F !important; /* สี placeholder น้ำตาลอ่อนขึ้น */
    }

    .form-control:focus, .form-select:focus {
      background-color: #fff !important;
      border-color: var(--sweet-pink); /* เปลี่ยนสีขอบเป็นชมพู */
      box-shadow: 0 0 10px var(--input-focus-shadow-color);
    }

    /* ปรับแต่ง Dropdown */
    option {
      background-color: #fff;
      color: var(--text-color);
    }

    /* ปุ่มกด บันทึกข้อมูล */
    .btn-submit {
      background-color: var(--submit-btn-color);
      border: none;
      color: var(--submit-btn-text-color);
      border-radius: 20px; /* มุมโค้งมนมากขึ้น */
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(255, 138, 128, 0.3);
    }

    .btn-submit:hover {
      background-color: var(--submit-btn-hover-color);
      color: #fff;
      transform: translateY(-1px); /* ขยับขึ้นเล็กน้อย */
      box-shadow: 0 4px 8px rgba(255, 82, 82, 0.4);
    }

    .btn-submit:disabled {
      background-color: #E0E0E0;
      color: #888;
      box-shadow: none;
    }

    /* กล่อง Alert */
    .alert {
      border: none;
      border-radius: 15px;
    }
    .alert-success {
      background-color: rgba(165, 214, 167, 0.2); /* เขียวอ่อน */
      color: #388E3C;
      border: 1px solid #A5D6A7;
    }
    .alert-danger {
      background-color: rgba(239, 154, 154, 0.2); /* แดงอ่อน */
      color: #D32F2F;
      border: 1px solid #EF9A9A;
    }

    /* เครดิตผู้พัฒนา */
    .developer-credit {
      text-align: center;
      margin-top: 25px;
      font-size: 0.9rem;
      color: #8D6E63;
      line-height: 1.6;
    }
    .developer-credit strong {
      color: #AD1457;
      text-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container mb-5">
    <div class="row justify-content-center align-items-center">
      <div class="col-md-4 d-none d-md-block text-center mb-4">
        <div style="font-size: 20rem; color: var(--sweet-pink);">
          🐰
        </div>
      </div>
      
      <div class="col-md-8 col-lg-6">
        <div class="card p-4 p-sm-5">
          <div class="cartoon-mascot">🌸</div>
          
          <div class="header-box text-center">
            <h3 class="mb-2 header-title">
              🌸 ระบบบันทึกการเบิก-คืนโทรศัพท์ 🌸
            </h3>
            <p class="mb-0 text-sm" style="color: #A1887F;">[ ระบบบันทึกสำหรับนักเรียนคนเก่ง ]</p>
          </div>
          
          <form id="phoneForm">
            <div class="mb-4">
              <label class="form-label">▣ ประเภทรายการ (ของฉัน)</label>
              <select class="form-select fw-bold" id="type" onchange="toggleFields()" required>
                <option value="เบิก (Borrow)">🟢 เบิกโทรศัพท์ (BORROW)</option>
                <option value="คืน (Return)">🔵 คืนโทรศัพท์ (RETURN)</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label">▣ หมายเลขเครื่อง (S/N)</label>
              <input type="text" class="form-control" id="sn" placeholder="กรอกเลข S/N หรือรหัสตู้/เครื่องจ้า" required>
            </div>

            <div id="borrowFields">
              <div class="row">
                <div class="col-sm-6 mb-4">
                  <label class="form-label">▣ รหัสนักเรียน (ID)</label>
                  <input type="text" class="form-control" id="studentId" placeholder="เช่น 59XXX">
                </div>
                <div class="col-sm-6 mb-4">
                  <label class="form-label">▣ ชั้น / ห้อง (CLASS)</label>
                  <input type="text" class="form-control" id="studentClass" placeholder="เช่น ม.6/1, ม.3/2">
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label">▣ ชื่อ-นามสกุล (FULL NAME)</label>
                <input type="text" class="form-control" id="name" placeholder="เด็กชาย / เด็กหญิง / นาย / นางสาว">
              </div>
              <div class="mb-4">
                <label class="form-label">▣ รุ่นโทรศัพท์ (DEVICE MODEL)</label>
                <input type="text" class="form-control" id="model" placeholder="เช่น iPhone 15, iPad Air, Samsung">
              </div>
            </div>

            <div class="mb-5">
              <label class="form-label">▣ หมายเหตุ (เพิ่มเติม)</label>
              <input type="text" class="form-control" id="note" placeholder="เช่น หน้าจอมีรอย, ฝากช่วงสอบ, หรือระบุวัตถุประสงค์">
            </div>

            <button type="submit" class="btn w-100 btn-submit" id="submitBtn">
              🐰 บันทึกข้อมูลเรียบร้อยจ้า! 🌸
            </button>
          </form>

          <div id="alertBox" class="alert mt-4 d-none text-center fw-bold" role="alert"></div>
          
        </div>

        <div class="d-md-none text-center mt-4">
          <div style="font-size: 10rem; color: var(--sweet-pink);">
            🐰
          </div>
        </div>

        <div class="developer-credit">
          DEVELOPED BY<br>
          <strong>นางสาวฐรินดา เหล่าเลิศ</strong><br>
          โรงเรียนราชประชานุเคราะห์ 29 ชั้น ม.6
        </div>

      </div>
    </div>
  </div>

  <script>
    // ช่องสำหรับวางลิงก์ Web App URL ที่ได้จากการ Deploy ของ Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxo13wCBrbuxpWMo-BNqRXVCMRV5WkNMf1IzfXE02CXfVQqgKrWsQq_X9Mt_ZqT62SJGw/exec";

    // ฟังก์ชันเปิด/ปิด และจัดการ Field ตามประเภทรายการ
    function toggleFields() {
      const type = document.getElementById('type').value;
      const borrowFields = document.getElementById('borrowFields');
      const studentId = document.getElementById('studentId');
      const studentClass = document.getElementById('studentClass');
      const nameInput = document.getElementById('name');
      const modelInput = document.getElementById('model');

      if (type === 'คืน (Return)') {
        borrowFields.style.display = 'none';
        studentId.removeAttribute('required');
        studentClass.removeAttribute('required');
        nameInput.removeAttribute('required');
        modelInput.removeAttribute('required');
        // ล้างข้อมูลเพื่อความถูกต้อง
        studentId.value = '';
        studentClass.value = '';
        nameInput.value = '';
        modelInput.value = '';
      } else {
        borrowFields.style.display = 'block';
        studentId.setAttribute('required', '');
        studentClass.setAttribute('required', '');
        nameInput.setAttribute('required', '');
        modelInput.setAttribute('required', '');
      }
    }

    // ทำงานเมื่อมีการกดส่งฟอร์ม
    document.getElementById('phoneForm').onsubmit = function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      
      // ล็อกปุ่มกดชั่วคราวเพื่อป้องกันการกดซ้ำ
      submitBtn.disabled = true;
      submitBtn.innerHTML = '⏳ ซิงค์ข้อมูลเข้าสู่ระบบจ้า...';
      alertBox.classList.add('d-none');

      // ดึงข้อมูลจาก Inputs
      const data = {
        type: document.getElementById('type').value,
        sn: document.getElementById('sn').value,
        studentId: document.getElementById('studentId').value,
        studentClass: document.getElementById('studentClass').value,
        name: document.getElementById('name').value,
        model: document.getElementById('model').value,
        note: document.getElementById('note').value
      };

      // แปลงข้อมูลเป็น URLSearchParams เพื่อส่งแบบ Form Data
      const formData = new URLSearchParams();
      for (const key in data) {
        formData.append(key, data[key]);
      }

      // ยิง Request ไปยัง Google Apps Script API
      fetch(SCRIPT_URL, {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(result => {
        alertBox.classList.remove('d-none', 'alert-success', 'alert-danger');
        
        if (result.status === "success") {
          alertBox.classList.add('alert-success');
          alertBox.innerHTML = 'SYSTEM: ' + result.message;
          document.getElementById('phoneForm').reset();
          toggleFields(); 
        } else {
          alertBox.classList.add('alert-danger');
          alertBox.innerHTML = 'ERROR: ' + result.message;
        }
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🐰 บันทึกข้อมูลเรียบร้อยจ้า! 🌸';
      })
      .catch(error => {
        alertBox.classList.remove('d-none', 'alert-success');
        alertBox.classList.add('alert-danger');
        alertBox.innerHTML = 'SYSTEM ERROR: ' + error.message;
        
        submitBtn.disabled = false;
        submitBtn.innerHTML = '🐰 บันทึกข้อมูลเรียบร้อยจ้า! 🌸';
      });
    };

    // รันตอนเปิดหน้าเว็บครั้งแรกเพื่อตั้งค่าการซ่อน/แสดง Field ให้พร้อม
    toggleFields();
  </script>
</body>
</html>
